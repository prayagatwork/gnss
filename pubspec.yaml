name: skytrack_gnss_explorer
description: SkyTrack GNSS Explorer - Windows/Android GNSS receiver, parser, dashboard and logger.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_libserialport: ^0.4.0     # Windows COM port access
  path_provider: ^2.1.3             # Windows log/output directories
  file_picker: ^8.0.0               # simulation file picker / export
  intl: ^0.19.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
